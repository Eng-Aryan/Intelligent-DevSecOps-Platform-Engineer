
services:
  mongo:
    image: mongo:7
    container_name: devsecops-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - devsecops-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devsecops-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/devsecops
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JENKINS_URL: http://host.docker.internal:8080
      SONAR_URL: http://host.docker.internal:9000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - devsecops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devsecops-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - devsecops-network

volumes:
  mongo-data:

networks:
  devsecops-network:
    driver: bridge
